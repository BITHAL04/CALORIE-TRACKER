services:
- type: web
  name: nexafit-backend
  runtime: docker
  repo: https://github.com/BITHAL04/CALORIE-TRACKER
  branch: main
  rootDir: backend
  plan: free
  envVars:
  - key: MONGODB_URI
    sync: false
  - key: DATABASE_NAME
    value: nexafit
  - key: SPOONACULAR_API_KEY
    sync: false
  - key: ANTHROPIC_API_KEY
    sync: false
  region: singapore
  dockerContext: .
  dockerfilePath: ./Dockerfile
version: "1"
